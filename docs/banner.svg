<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pocket Grove</title>
  <desc id="desc">A task-powered 3D miniature world builder</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bd6ea"/>
      <stop offset="0.55" stop-color="#cde9ee"/>
      <stop offset="1" stop-color="#f9dfba"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="0.08" r="0.45">
      <stop offset="0" stop-color="#fff5cf" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff5cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6d3a8"/>
      <stop offset="1" stop-color="#a2c493"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2f3a34" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#sun)"/>

