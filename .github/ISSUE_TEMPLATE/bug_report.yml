name: Bug report
description: Something in the grove is not behaving as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Complete a task
        3. Buy a Pine Tree
        4. ...
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Viewport and browser
      placeholder: "1440x900, Chrome 131 on macOS"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any errors from the browser console.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or save data
      description: Drag in an image or paste the `pocket-grove-v1` localStorage value if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I am using a supported desktop browser.
          required: true
